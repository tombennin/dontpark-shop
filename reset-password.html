<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Set Your Password | DontPark</title>
<style>
body{font-family:-apple-system,sans-serif;background:#f8fafc;display:flex;
align-items:center;justify-content:center;min-height:100vh;margin:0}
.card{background:#fff;padding:32px;border-radius:12px;max-width:400px;width:90%;
box-shadow:0 4px 20px rgba(0,0,0,.08)}
h1{font-size:1.3rem;margin:0 0 8px}
p{color:#64748b;font-size:.95rem;margin:0 0 20px}
input{width:100%;padding:14px;border:2px solid #e2e8f0;border-radius:8px;
font-size:1rem;margin-bottom:12px;box-sizing:border-box}
button{width:100%;background:#10b981;color:#fff;border:0;padding:16px;
border-radius:8px;font-size:1rem;font-weight:700;cursor:pointer}
button:disabled{background:#94a3b8;cursor:not-allowed}
#msg{margin-top:14px;font-size:.9rem}
.err{color:#dc2626}.ok{color:#059669}
</style>
</head>
<body>
<div class="card">
  <h1>Set your password</h1>
  <p id="sub">Checking your link…</p>
  <div id="form" style="display:none">
    <input type="password" id="pw1" placeholder="New password (12+ characters)">
    <input type="password" id="pw2" placeholder="Re-type new password">
    <button id="save">Save password</button>
  </div>
  <div id="msg"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://uhrhukcovvvbmopvoncr.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVocmh1a2NvdnZ2Ym1vcHZvbmNyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTQ1MzIyMzcsImV4cCI6MjA3MDEwODIzN30.Ce69ktLB8h_OMe0H1XpDmRjKZawGlb59ProIs8UEaRw';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const sub = document.getElementById('sub');
const form = document.getElementById('form');
const msg = document.getElementById('msg');

sb.auth.onAuthStateChange((event) => {
  if (event === 'PASSWORD_RECOVERY' || event === 'SIGNED_IN') showForm();
});

(async () => {
  const { data } = await sb.auth.getSession();
  if (data.session) showForm();
  else setTimeout(async () => {
    const { data: d2 } = await sb.auth.getSession();
    if (d2.session) showForm();
    else {
      sub.textContent = 'This link has expired or was already used.';
      msg.innerHTML = '<span class="err">Ask Thomas to send a new one.</span>';
    }
  }, 1500);
})();

function showForm(){
  sub.textContent = 'Choose a password you will remember.';
  form.style.display = 'block';
}

document.getElementById('save').onclick = async () => {
  const p1 = document.getElementById('pw1').value;
  const p2 = document.getElementById('pw2').value;
  msg.innerHTML = '';
  if (p1.length < 12) { msg.innerHTML = '<span class="err">At least 12 characters.</span>'; return; }
  if (p1 !== p2) { msg.innerHTML = '<span class="err">Passwords do not match.</span>'; return; }
  const btn = document.getElementById('save');
  btn.disabled = true; btn.textContent = 'Saving…';
  const { error } = await sb.auth.updateUser({ password: p1 });
  if (error) {
    msg.innerHTML = '<span class="err">' + error.message + '</span>';
    btn.disabled = false; btn.textContent = 'Save password';
  } else {
    form.style.display = 'none';
    sub.textContent = 'Password saved.';
    msg.innerHTML = '<span class="ok">Taking you to your dashboard…</span>';
    setTimeout(() => location.href = '/index.html', 1800);
  }
};
</script>
</body>
</html>
